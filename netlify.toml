[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

# --------------------------------------------------
# Cache headers for static assets (30+ day caching)
# Requirement 10.5: Browser caching for at least 30 days
# --------------------------------------------------

# Public static assets (CSS, JS, images, audio)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2678400, immutable"

# Next.js build-hashed static chunks (JS, CSS, media)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js optimized images
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=2678400, stale-while-revalidate=86400"

# Fonts
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon and manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=2678400, immutable"

# Service worker - short cache to allow updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Workbox runtime - long cache (content-hashed filename)
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --------------------------------------------------
# Compression: Netlify automatically serves Brotli when
# the client sends Accept-Encoding: br, falling back to
# gzip otherwise. No additional config needed.
# Requirements 10.6, 10.7: Brotli for JS/CSS with gzip fallback
# --------------------------------------------------

# Domain migration (old -> new)
[[redirects]]
  from = "https://valorantaimtrainer.online/*"
  to = "https://aimtrainerpro.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.valorantaimtrainer.online/*"
  to = "https://aimtrainerpro.online/:splat"
  status = 301
  force = true

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
